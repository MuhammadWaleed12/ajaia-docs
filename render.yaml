# Render Blueprint (free tier).
#
# Render's free tier does not support persistent disks, so we use Turso
# (free hosted libSQL) for the database. Attachments are written to the
# container filesystem; they persist within a running container but are
# lost on redeploy / spin-down. All other data (users, documents, shares)
# lives in Turso and persists forever.
#
# Setup once (see README § 4):
#   1. Sign up at https://turso.tech (GitHub login, no card).
#   2. `turso db create ajaia`  →  copy the libsql://... URL.
#   3. `turso db tokens create ajaia`  →  copy the token.
#   4. In Render, when it prompts for DATABASE_URL and DATABASE_AUTH_TOKEN
#      after applying this blueprint, paste those values.
services:
  - type: web
    name: ajaia-docs
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false            # e.g. libsql://ajaia-<you>.turso.io
      - key: DATABASE_AUTH_TOKEN
        sync: false            # the Turso token from step 3 above
      - key: UPLOAD_DIR
        value: /tmp/ajaia-uploads
      - key: SESSION_SECRET
        generateValue: true
